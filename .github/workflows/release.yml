name: release

# Publishes to PyPI when a version tag is pushed.
#
# No API token is stored anywhere: this uses PyPI Trusted Publishing, where PyPI
# verifies the workflow's OIDC identity instead of a long-lived secret. A token
# in a repository secret is a token that can leak; this cannot.
#
# One-time setup on PyPI (Your projects -> Publishing -> Add a new pending publisher):
#   PyPI project name: outcome-watchdog
#   Owner:             luandv92
#   Repository:        outcome-watchdog
#   Workflow filename: release.yml
#   Environment:       pypi

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
